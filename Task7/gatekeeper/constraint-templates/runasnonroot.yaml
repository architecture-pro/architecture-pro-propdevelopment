apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiresecurity
spec:
  crd:
    spec:
      names:
        kind: K8sRequireSecurity
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiresecurity

        import rego.v1

        violation contains {"msg": msg} if {
          container := input.review.object.spec.containers[_]
          not runs_as_non_root(container)
          msg := sprintf("Container %v must run as non-root", [container.name])
        }

        violation contains {"msg": msg} if {
          container := input.review.object.spec.containers[_]
          not container.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("Container %v must use readOnlyRootFilesystem=true", [container.name])
        }

        runs_as_non_root(container) if {
          container.securityContext.runAsNonRoot == true
        }

        runs_as_non_root(container) if {
          input.review.object.spec.securityContext.runAsNonRoot == true
          not container.securityContext.runAsNonRoot == false
        }
