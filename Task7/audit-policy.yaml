apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    namespaces:
      - audit-zone
    resources:
      - group: ""
        resources: ["pods"]

  - level: Metadata
    resources:
      - group: "templates.gatekeeper.sh"
        resources: ["constrainttemplates"]
      - group: "constraints.gatekeeper.sh"
        resources: ["*"]

  - level: Metadata
